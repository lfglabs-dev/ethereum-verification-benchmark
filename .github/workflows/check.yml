name: check

on:
  repository_dispatch:
    types:
      - benchmark-case-changed
  push:
    branches:
      - main
      - master
      - codex/**
  pull_request:
  workflow_dispatch:

concurrency:
  # `github.ref` differs between the two events that fire for the same commit:
  # a push to `codex/**` gives `refs/heads/codex/...` while its pull_request
  # gives `refs/pull/N/merge`. The groups never matched, so both ran — and on
  # this repo's single self-hosted runner they serialise, doubling time-to-green
  # (PR #158: check passed in 1h56, its duplicate then queued for another).
  # `head_ref` is the PR's source branch, so a PR now shares a group with the
  # push that created it and cancel-in-progress keeps only the newer run.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CACHE_BUCKET: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('ref-{0}', github.ref_name) }}
  MAIN_CACHE_BUCKET: ref-main
  USE_STICKY_DISKS: "true"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      cases: ${{ steps.select.outputs.cases }}
      full: ${{ steps.select.outputs.full }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select validation scope
        id: select
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python3 scripts/select_ci_cases.py \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/select_ci_cases.py \
              --force-full \
              --github-output "$GITHUB_OUTPUT"
          fi

  check:
    needs: plan
    # check_fair_harness_policy.py invokes `lake env lean` directly even in
    # --quick mode, so this job still needs Lean. It stays off the single
    # self-hosted benchmark runner (GitHub-hosted cache instead of sticky
    # disks) so a queued full sweep there cannot delay an ordinary PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Unit tests exercise history-sensitive v0.2 contract behavior.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: ./.github/actions/setup-lean
        with:
          use-sticky-disks: "false"

      - name: Report deferred full validation
        if: needs.plan.outputs.full == 'true' && (github.event_name == 'pull_request' || github.event_name == 'push')
        env:
          VALIDATION_REASON: ${{ needs.plan.outputs.reason }}
        run: |
          echo "::notice::Full validation is deferred to the nightly/manual workflow: $VALIDATION_REASON"

      - name: Run quick repo check
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: ./scripts/check.sh --quick

  compile-changed-cases:
    needs: plan
    if: (github.event_name == 'pull_request' || github.event_name == 'push') && needs.plan.outputs.cases != '[]'
    # nippur-verity-bench-1 (db2.starknet.id) — replaces former
    # blacksmith-4vcpu-ubuntu-2404. Labels pin this job to that runner
    # only, so it can never land on verity/fastlane/build/ocr.
    runs-on: [self-hosted, Linux, X64, nippur, verity, benchmark]
    env:
      DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: ./.github/actions/setup-lean
        with:
          use-sticky-disks: ${{ env.USE_STICKY_DISKS }}
          cache-bucket: ${{ env.CACHE_BUCKET }}
          main-cache-bucket: ${{ env.MAIN_CACHE_BUCKET }}
          use-build-sticky-disk: "true"

      - name: Install dotenvx
        run: npm install -g @dotenvx/dotenvx@1.57.0

      - name: Compile changed active cases
        env:
          CHANGED_CASES_JSON: ${{ needs.plan.outputs.cases }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          cases = json.loads(os.environ["CHANGED_CASES_JSON"])
          for case in cases:
              print(f"::group::{case}")
              try:
                  subprocess.run(["./scripts/run_case.sh", case], check=True)
              finally:
                  print("::endgroup::")
          PY

  full-check:
    needs: plan
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: [self-hosted, Linux, X64, nippur, verity, benchmark]
    env:
      DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: ./.github/actions/setup-lean
        with:
          use-sticky-disks: ${{ env.USE_STICKY_DISKS }}
          cache-bucket: ${{ env.CACHE_BUCKET }}
          main-cache-bucket: ${{ env.MAIN_CACHE_BUCKET }}
          use-build-sticky-disk: "true"

      - name: Install dotenvx
        run: npm install -g @dotenvx/dotenvx@1.57.0

      - name: Run manually requested full repo check
        env:
          VALIDATION_REASON: ${{ needs.plan.outputs.reason }}
        run: |
          echo "Running full validation: $VALIDATION_REASON"
          ./scripts/check.sh
