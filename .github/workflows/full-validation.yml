name: Full validation

# The frozen v0.2 reference validator recompiles 240 Lean declarations and is
# intentionally kept off the ordinary PR path.  It remains available on a
# predictable cadence and on demand for release or shared-runtime changes.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: full-validation
  cancel-in-progress: false

env:
  CACHE_BUCKET: ${{ github.ref_name == 'main' && 'ref-main' || format('full-{0}', github.ref_name) }}
  MAIN_CACHE_BUCKET: ref-main
  USE_STICKY_DISKS: "true"

jobs:
  check:
    runs-on: [self-hosted, Linux, X64, nippur, verity, benchmark]
    env:
      DOTENV_PRIVATE_KEY: ${{ secrets.DOTENV_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: ./.github/actions/setup-lean
        with:
          use-sticky-disks: ${{ env.USE_STICKY_DISKS }}
          cache-bucket: ${{ env.CACHE_BUCKET }}
          main-cache-bucket: ${{ env.MAIN_CACHE_BUCKET }}
          use-build-sticky-disk: "true"

      - name: Install dotenvx
        run: npm install -g @dotenvx/dotenvx@1.57.0

      - name: Run full repo check
        run: ./scripts/check.sh
