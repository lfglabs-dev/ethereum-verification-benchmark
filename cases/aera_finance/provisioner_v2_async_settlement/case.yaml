abstraction_notes: >
  Source-structured model of one active request and all four terminal outcomes.
  Request hashes use collision-free Address keys; request fields and aggregate token/unit
  custody are ghost or external-balance abstractions.
  The hash-committed fixed-price bit and the direct-settlement fixed-price gate are
  explicit. Reverting external interactions do not count as terminal outcomes.
unsupported_feature_codes:
