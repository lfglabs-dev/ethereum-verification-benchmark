  - external_erc20_balance_state_not_modeled
notes: >
  One public invariant is proof-complete with no sorry and no project-defined axioms:
  an active request activation cannot produce two terminal outcomes. Six route lemmas
  cover live vault solve, live fixed-price direct solve, expired vault/direct
  solve-triggered refund, authorized refund, and cancellation.
