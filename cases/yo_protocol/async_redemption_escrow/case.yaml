abstraction_notes: >
  Source-close model for requestRedeem, public redeem, fulfillRedeem,
  cancelRedeem, _withdraw, _getAvailableBalance, fee configuration, and
  AuthUpgradeable.isAuthorized. Successful oracle preview and balance-read
  outcomes, selector authority outcomes, and SafeERC20 outcomes are explicit
  trusted boundary abstractions; they are not executable token semantics. During
  any authority, preview/read, or token boundary, no callback may mutate any
  modeled vault state. Pending assets are gross units; fulfillment uses the
  current fee-on-total configuration. The pinned underlying is constrained
  distinct from the vault where relevant. Events, unrelated ERC-4626 behavior,
  manage calls between lifecycle transitions, and later proxy upgrades remain
  excluded.
unsupported_feature_codes:
