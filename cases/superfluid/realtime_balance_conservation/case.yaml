notes: >
  This case does not prove SuperToken supply conservation and does not equate
  its modulo-2^256 CFA projection sum to native `realtimeBalanceOf` outside the
  stated relation. All 22 task declarations have kernel-checked reference proofs,
  including the nine finite-global, future-time, callback-composition, rollback,
  and concrete factored-instance strengthening tasks.
  Translation fidelity is an audited trust boundary, separate from the kernel-checked
  Lean proof of the model.
