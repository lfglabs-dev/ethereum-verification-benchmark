abstraction_notes: >
  The completed reference proofs verify the CFA projection `sharedSettled + dynamic
  CFA balance` at the transaction update boundary, the pair net-rate sum, and
  unrelated-account framing for separate create, update, and sender-noncritical
  delete entrypoints. The strengthened reference proofs lift pair cancellation
  and framing to a duplicate-free fixed List Address modular CFA-only sum for
  every tau at or after the operation timestamp.
  The case explicitly scopes the Host timestamp to the canonical uint32 chain-time
  range; this is not a Solidity revert guard. Decoded source state enforces
  sign-extended int96 rates, clipped deposits, existence guards, zero-address guards, outer direct-call
  context with a zero app-credit token and actor equal to the flow sender,
  exact source deposit calculation with arbitrary governance minimum selection and
  source-faithful low-64-bit packed storage writes. Raw flow/account deposit writes
  are explicitly scoped below 2^96 to exclude source-accepted values whose unmasked
  high bits overlap the adjacent packed rate field,
  and CFA-only availability checks. Non-app paths require both endpoints to be
  non-app. The callback model pins
  contracts/mocks/CFAAppMocks.t.sol:190-243: an active non-jailed receiver app
  has before-created NOOP, executes after-created, calls Host context to delete
  the same newly created flow, causes no nested callback, uses zero app credit,
  and lets the outer CFA code reload the zero flow. That schedule is factored into
  executable prefix, level-1 contextual delete, and resume/reload components. A
  reusable behavioral hook executes an actual supplied Contract at level 1,
  rejects level 2 before nested execution, and relies on Verity bind/run semantics
  for no-resume rollback. The hook is not complete Host ABI/context semantics;
  concrete actor/app/token/context, registry, noop, jailed, and credit guards remain
  in the SelfDeleting prefix. The source precondition pins a
  non-jailed receiver and successful execution selects the no-damage final-availability
  path. IDA/GDA and pools,
  multi-agreement native available-balance aggregation, critical deletion and
  liquidation, arbitrary callbacks, update callbacks, mint/burn, and wrapping
  are not covered. Frame theorems cover account projection fields only.
  This is a proof of the hand-translated Verity model under explicit source-key,
  Host-context, and callback-schedule hypotheses. It is not a Solidity bytecode
  simulation theorem, and it does not independently derive Keccak flow keys or
  Host execution from source semantics.
unsupported_feature_codes:
