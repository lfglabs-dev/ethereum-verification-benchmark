abstraction_notes: >
  This case packages a hand-written Lean state machine aligned to the selected
  Paraclear Cairo deposit paths. It models both public direct-deposit wrappers,
  public and internal guards, account creation, ERC20 allowance/transfer/balance
  observations, exact received-amount enforcement, i128/u256 bounds, decimal
  flooring, raw custody, signed balances, and the observable one-key effect of
  upsert_asset_balance. All external dispatcher calls are atomic observations and
  ERC20 decimals are stable across the transition. Linked-list pointers, events,
  returned felts, callbacks, bridge deposits, withdrawals, settlement, fees,
  liquidations, pending transfers, socialized-loss application, later rebases,
  and arbitrary later ERC20 behavior are outside the model. The ordered model checks
  source-ordered predicates and proves refinement between two handwritten Lean
  models. The reference proofs establish decoded amount-record correspondence under an explicit
  well-formedness relation. Registry configuration is modeled explicitly. There is no mechanized
  Cairo-to-Lean, Sierra-to-Lean, CASM, or deployed-class correspondence. Canonical
  source paths retain the original repository's src/ prefix; in the reviewed supplied
  extraction, the hash-matching files were rooted at paraclear/paraclear.cairo and
  token/token.cairo.
unsupported_feature_codes:
  - cairo_source_correspondence_missing
  - external_dispatcher_callbacks_elided
  - erc20_metadata_stability_assumed
notes: >
  A successful modeled deposit or deposit_on_behalf_of cannot reduce the deposited
  token's backing slack, defined as normalized raw ERC20 custody minus the sum of
  positive posted internal balances. This is one local preservation step toward
  exchange solvency, not a proof of global Paraclear solvency.
