abstraction_notes: >
  Models IndexedMerkleTree.setup and insert. IMTLeaf is flattened into three
  Uint256 maps. FullMerkle hashing and verifyNonInclusion are out of scope.
  The Solidity while-walk is a fuel-bounded recursive helper because pinned
  Verity has no Stmt.while. The selected invariant is one covering ordered
  chain from sentinel 0 (IMTOrder), not physical-array sorting and not
  Merkle-authenticated non-inclusion. IMTValidState preserves that central
  order theorem and adds the minimal valueToIndex consistency relation: every
  occupied non-sentinel leaf is named by valueToIndex at its value. This makes
  the modeled valueToIndex[value] == 0 guard derive genuine leaf-value
  absence, without a caller-supplied valueNotStored premise. setup
  establishment requires fresh-zero mappings.
unsupported_feature_codes: []
notes: >
  zkSync Era atomic-interop IMT linked-list order. Physical indices are
  append order; ordering is the nextIndex chain from sentinel 0.
