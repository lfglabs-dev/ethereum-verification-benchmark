abstraction_notes: >
  Fully proved from the incoming conservation invariant alone for every modeled
  receipt-flag combination, beneficiary/not-executed guard, checked underflow,
  successful equal debit, and explicit per-token SafeTransferLib outcome. If either
  transfer fails, Contract.run atomically restores the incoming state, including
  any earlier VLR rescue writes. Successful transfers assume faithful balanceOf,
  exact requested-amount debits, and no fees, rebases, seizures, donations,
  reentrancy-induced accounting mutation, or unrelated atomic perturbations.
  Beneficiary-or-owner authorization is a public-boundary scope exclusion.
