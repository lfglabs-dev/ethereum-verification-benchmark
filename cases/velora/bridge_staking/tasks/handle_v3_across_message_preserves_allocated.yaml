abstraction_notes: >
  The target covers VLR and WETH receive, stake success, stake catch with inline
  rescue, SafeTransferLib success/failure, and every reverting guard or checked-
  arithmetic path. Its synchronized specification binds the actual transition and
  asks for conservation from the incoming invariant. After exact beneficiary-
  sentinel initialization, callback amount validation uses the selected stored
  amount for both new and existing records. `depositResult` explicitly selects the
  external seVLR success-versus-catch outcome; Boolean per-token transfer results
  select each inline rescue transfer outcome. No external call is invoked or linked.
  Successful deposit and inline rescue debit each modeled balance by the same amount
  as its allocation; transfer failure atomically restores the incoming state,
  including earlier rescue writes. The Solidity interpretation assumes entry
  balances include Across delivery, balanceOf is faithful, successful transfers
  debit exactly the requested amount, and no fee, rebase, seizure, donation,
  reentrancy-induced accounting mutation, or other atomic balance perturbation
  occurs. Public caller, authorization, pause checks, approvals, sourceChainId,
  ABI decoding, and events are scope exclusions. Storage is flattened semantic
  storage rather than upstream EVM layout. The reference module mechanically proves
  the transition by composing record-preparation, token-credit, and settlement
  lemmas; the generated task remains an open proof obligation for benchmark agents.
