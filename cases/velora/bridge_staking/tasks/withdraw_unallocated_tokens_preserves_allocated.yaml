abstraction_notes: >
  Fully proved under the conservation invariant alone. Successful executions
  withdraw balance - allocated and leave balance equal to allocated; arithmetic,
  zero-amount, and explicit SafeTransferLib failure outcomes atomically revert to
  the unchanged state. The Boolean transfer result is an external-call outcome
  abstraction. Relating successful modeled debits to ERC-20 execution assumes
  faithful balanceOf, exact requested-amount debits, and no fees, rebases, seizures,
  donations, reentrancy-induced accounting mutation, or other atomic balance
  perturbations. Solidity accepts arbitrary token addresses; this task intentionally
  covers only the VLR/WETH accounting slice selected by `isVlr`. Owner authorization
  is a public-boundary scope exclusion.
