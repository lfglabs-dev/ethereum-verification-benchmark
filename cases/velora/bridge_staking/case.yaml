abstraction_notes: >
  The benchmark targets Velora BridgeStaking's accounting conservation invariant:
  allocatedTokens[token] <= tokenBalance[token] for both VLR and WETH. This
  proves the owner's withdrawUnallocatedTokens can never consume allocated
  pending staking funds. Token balances (token.getBalance() in Solidity, which
  calls IERC20(token).balanceOf(address(this))) are modeled as scalar storage
  slots in a flattened semantic storage model, not the upstream inherited and
  packed EVM layout. The seVLR depositVLRAndWeth external call is not invoked or
  linked: it is represented by the explicit `depositResult` input, where 1 selects
  success and every other value selects catch/rescue. Boolean transfer-result inputs
  model each SafeTransferLib call in catch/rescue, public rescue, and owner withdrawal;
  false atomically reverts the complete modeled transaction. Successful seVLR and
  transfer branches subtract exact amounts from modeled balances and allocations.
  Entry balances are assumed to include the Across delivery and faithfully represent
  balanceOf, with no fees, rebases, seizures, donations, reentrancy-induced accounting
  mutation, or unrelated atomic balance changes. Approval execution and `minBptAmount`
  behavior are outside scope. Public caller, authorization, pause checks, sourceChainId,
  ABI decoding, and events are scope exclusions. Callback handling exactly uses the
  VLR/WETH token domain; owner withdrawal is intentionally the VLR/WETH accounting
  slice even though Solidity accepts arbitrary token addresses. keccak256(updatedMessage)
  is abstracted as an opaque Uint256
  argument. The Staking struct is flattened: each field becomes its own keyed
  mapping. The exact beneficiary sentinel is preserved, and callback amount
  validation reads the selected stored amount after conditional initialization.
unsupported_feature_codes:
  - erc20_external_balance_modeled_as_storage
  - external_call_success_modeled_as_parameter
notes: >
  Proofs.lean contains complete proofs from the incoming conservation invariant
  alone for withdrawUnallocatedTokens, rescuePendingFunds, and
  handleV3AcrossMessage. The proofs cover checked arithmetic, explicit guards,
  partial rescue flags, successful equal debits, and SafeTransferLib failure
  outcomes that atomically restore the incoming state. `depositResult` remains the
  explicit seVLR boundary input. Generated tasks retain proof holes for benchmark
  agents; the reference proof module contains no proof holes or Velora-specific
  axioms.
  The exact beneficiary sentinel and external-call scope are documented in
  Contract.lean and Specs.lean.
