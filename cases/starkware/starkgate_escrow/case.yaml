abstraction_notes: >
  Focused StarkGate L1 accounting slice for the escrow lower-bound invariant.
  The ghost `assetBalance` represents `IERC20.balanceOf(address(this))` (or
  `address(this).balance` for the ETH bridge). The ghost counters
  `cumulativeDeposits` and `cumulativeWithdrawals` track total accepted deposits
  and total outflows (withdrawals plus reclaims). Cross-domain messaging
  (sendMessageToL2, consumeMessageFromL2, cancelL1ToL2Message) is abstracted as
  gates that succeed on the modeled path. The max-balance cap is modeled as a
  hypothesis, not an internal constraint.
unsupported_feature_codes:
  - external_erc20_balance_ghosted
  - cross_domain_messaging_elided
  - fee_logic_donation_equivalent
notes: >
  Reference proofs are complete for the escrow lower-bound invariant across the
  three modeled transitions (deposit, withdraw, depositReclaim). Arithmetic
  hypotheses expose Solidity checked-arithmetic obligations (no-overflow on
  additions, sufficient-balance on subtractions).
