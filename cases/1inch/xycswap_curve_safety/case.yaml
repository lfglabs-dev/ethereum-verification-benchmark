notes: >
  Benchmark case proving the fee-adjusted constant-product curve safety
  invariant for 1inch Aqua XYCSwap. The theorem states that the output amount
  computed by _quoteExactIn satisfies the integer-division rounding bound:
  output * denominator <= feeAdjustedInput * balanceOut. This is the direct
  analog of the Uniswap V2 K invariant, adapted to XYCSwap's basis-points fee
  structure.
