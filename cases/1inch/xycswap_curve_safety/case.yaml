abstraction_notes: >
  The slice isolates the pure arithmetic of _quoteExactIn, which computes the
  output amount for a swap using the fee-adjusted constant-product formula.
  External calls (AQUA.pull, xycSwapCallback, _safeCheckAquaPush) are elided
  because the output amount is a pure function of the formula inputs. The
  Strategy struct is flattened: feeBps is a direct parameter. The zeroForOne
  direction selector is abstracted. _quoteExactOut is not modeled.
