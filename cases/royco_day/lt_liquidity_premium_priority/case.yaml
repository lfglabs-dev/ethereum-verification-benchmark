abstraction_notes: >
  Models the PR #20 head accountant state directly: collateral NAV, LPT raw NAV, ST/JT
  effective NAV, and JT impermanent loss. Collateral losses hit JT first and gains
  repay global JT impermanent loss before residual ST/JT allocation and premium or
  fee computation. The six post-operation checkpoints use current collateral and
  LPT values plus the ST self-liquidation bonus. Fee minting preserves the source's
  virtual-share conversion and dilution clamp. Utilization and market-transition
  conditions are recomputed from the resulting state. External YDM calls supply
  elapsed time and bounded uint128 accumulators. Balancer execution outputs remain
  explicit inputs with exact cap, no-op, success, and rollback branches. The Lean
  helpers `handleCollateralLoss` and `handleCollateralGain` name the two inline
  semantic blocks inside Solidity `_previewSyncTrancheAccounting`; they are not
  claimed as Solidity entry points.
unsupported_feature_codes:
