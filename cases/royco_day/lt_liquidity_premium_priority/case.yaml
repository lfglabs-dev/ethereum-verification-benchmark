  - erc20_share_mint_callbacks
notes: >
  Proves that Royco Day's source-head waterfall repays global JT impermanent loss
  before any residual gain, premium, or protocol fee. LPT liquidity premium stays
  inside ST effective NAV and is coverage-neutral until its ownership shares are
  minted. The prior independent-JT-fee counterexample was removed because PR #20 head
  eliminated independent tranche PnL inputs; a concrete partial-recovery regression
  now proves that remaining impermanent loss implies zero fees.
