abstraction_notes: >
  Models current raw NAVs, both source-attributed signed effective deltas, the
  source-ordered JT and ST waterfalls, dust-gated and recomputed fees, exact
  fixed-term output zeroing, exact utilization formulas, exact share-conversion
  boundaries, post-mint supply, operation-specific unchecked post-op formulas,
  and source-shaped inner reinvestment success/failure transitions. Claim
  attribution, external YDM calls that produce the elapsed window and
  time-weighted accumulators, market-state selection, and Balancer
  oracle/slippage valuation are explicit inputs to this slice. Premium division
  retains the source numerator, denominator, and single floor.
