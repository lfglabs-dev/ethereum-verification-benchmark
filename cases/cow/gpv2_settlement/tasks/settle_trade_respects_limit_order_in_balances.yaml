abstraction_notes: >
  Balance-level corollary of the per-trade guarantee. The token/Vault/ETH transfers are not modeled;
  the pull is assumed to take exactly the computed sell amount from the owner (DebitedExactly) and the
  payout to give exactly the computed buy amount to the receiver (CreditedExactly). Fee-on-transfer
  and rebasing tokens violate these hypotheses.
