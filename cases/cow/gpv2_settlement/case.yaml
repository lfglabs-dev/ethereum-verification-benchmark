abstraction_notes: >
  Models GPv2Settlement.computeTradeExecution (the per-trade check on the settle
  path) with exact SafeMath mul/div/ceilDiv/add revert semantics, plus the two
  other writers of filledAmount: invalidateOrder, one iteration of
  freeFilledAmountStorage, and the filledAmount bookkeeping of swap (no price
  claim for swap). The bytes-keyed filledAmount mapping (slot 2) is a
  word-keyed mapping. Order recovery, signature schemes, Vault/ERC20 transfers,
  interactions and the price logic of the Balancer swap() path are not modeled. The lifecycle
  relation fixes one signed order per uid and lets the environment do anything
  that leaves filledAmount[uid] unchanged and keeps time monotone. The deployed
  mainnet source (Sourcify exact match of 0x9008D19f58AAbD9eD0D60971565AA8510560ab41)
  differs from the pinned commit only by semantics-neutral syntax.
unsupported_feature_codes:
  - bytes_keyed_mapping_as_word_key
notes: >
  CoW Protocol settle path never violates a signed limit order: computed
  executed amounts respect the limit price after rounding; over a tracked order
  lifecycle, cumulative settle-path fills since tracking began never exceed the
  signed amount and fees stay pro rata. Under explicit token hypotheses (the
  pull takes exactly the computed amount from the owner, the payout gives
  exactly the computed amount to the receiver), the owner's and receiver's
  balance changes respect the same limit price and fee bound. swap() price, deadline and fee transfer
  are excluded (only its filledAmount bookkeeping is modeled, and swap fills are
  not counted). The fee cap excludes CoW's documented zero-amount replay
  (reproduced as a witness theorem).
