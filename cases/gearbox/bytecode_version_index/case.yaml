abstraction_notes: >
  The model preserves the three `_allowContract` branches and the exact writes
  made by `_updateVersionInfo`. Solidity bytes32 and uint256 values are modeled
  as natural numbers, mappings as total functions, and EnumerableSet as a
  membership function. Events, authorization/upload/audit caller guards, and
  unrelated repository storage are outside this internal-function slice.
unsupported_feature_codes: []
notes: >
  Proves the exact fresh-insertion transition, including `max(old, ver)` for
  latest, major, and minor indexes. It also proves the same-hash no-op and the
  different occupied-hash revert as reference coverage, while exposing only the
  fresh-insertion theorem as the benchmark task. Immutable source ranges:
