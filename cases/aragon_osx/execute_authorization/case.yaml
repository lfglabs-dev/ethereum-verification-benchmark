abstraction_notes: >
  The model preserves caller-specific, ANY_ADDR caller, and ANY_ADDR target
  lookup order for the DAO target; ALLOW_FLAG and condition semantics; the
  terminal behavior of a present specific condition; ROOT checks before direct
  mutations; and wildcard rejection for EXECUTE_PERMISSION_ID and
  ROOT_PERMISSION_ID. Grant targets are projected into DAO, ANY_ADDR, and other
  classes. Grants to other non-wildcard targets succeed without changing the
  modeled DAO-target slice. Condition callbacks are boolean outcomes, with false
  covering both false returns and caught reverts.
unsupported_feature_codes: []
notes: >
  This is an authorization benchmark, not an action-execution correctness
  benchmark. A successful execute reaches the modeled execute-body boundary only after
  exact permission resolution. Action calldata, native-value transfers,
  allowFailureMap handling, result hashing, events, and reentrancy are outside
  the theorem scope. DAO.sol is the primary case source. Its inherited authorization
  path is pinned at src/core/permission/PermissionManager.sol in the same upstream
  commit and is the source for isGranted, _auth, grant, grantWithCondition, and revoke.
