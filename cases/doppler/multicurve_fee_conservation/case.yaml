abstraction_notes: >
  Models both halves of INV-REH-1: reservation/carry equality and live manager-credit
  coverage, plus the stronger terminal partition across carry, beneficiary payments,
  and LP compounding. The modeled market's reservation remains equal to its carry;
  unchanged other-market reservations are summarized so manager-credit coverage is
  checked against the token-wide reservation total. Successful DAMM calls provide
  checked spent/received/provided amounts. An individual reverting leg is an identity,
  while prior successful conversion or balancing deltas remain represented by their
  non-identity transitions even if processFees ultimately returns false.
  Callback-during-processing theorems preserve snapshot isolation by bounding old
  processing against the pre-callback row.
  Token X and token Y are represented as distinct denominations; same-address
  token-pair aliasing is excluded.
  Price execution and unrelated Multicurve invariants are excluded.
