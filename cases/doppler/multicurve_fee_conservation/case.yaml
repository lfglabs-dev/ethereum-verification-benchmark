abstraction_notes: >
  Models both halves of INV-REH-1: reservation/carry equality and live manager-credit
  coverage, plus the stronger terminal partition across carry, beneficiary payments,
  and LP compounding. Successful DAMM calls provide checked spent/received/provided
  amounts; reverting legs are identity deferrals. Callback-during-processing theorems
  preserve snapshot isolation by bounding old processing against the pre-callback row.
  Price execution and unrelated Multicurve invariants are excluded.
