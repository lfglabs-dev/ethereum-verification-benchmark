abstraction_notes: >
  The model isolates successful-return checks from TydroPositionAccount. Open and
  close consume externally measured swap, Aave, and token outcomes and prove the
  inequalities enforced by source guards; it does not establish that Aave health
  factors, oracle prices, or token outcomes are economically correct. Lifecycle
  authority exposes the exact account, immutable identity, expiry, optional relayer,
  nonce, and recovered owner checks, while EIP-712 hashing and ECDSA recovery remain
  trusted inputs. Callback authority separately pins Pool caller, account initiator,
  borrow asset, and matching nonzero context, consuming the modeled EIP-1153 slot
  before external effects. Direct eMode and recovery paths remain owner-only, with
  recovery recipients fixed to the immutable owner. Clone construction, multihop
  routing, events, and unrelated registry policy are outside scope. The composed signed-open
  and signed-close theorems connect the modeled lifecycle-authority and floor-check stages
  under trusted digest/recovery inputs; they are not public-call or bytecode refinements.
unsupported_feature_codes:
  - external_aave_and_token_results_as_inputs
  - eip712_and_ecdsa_recovery_as_inputs
  - clone_immutable_argument_decoding_out_of_scope
  - eip1153_as_explicit_transaction_local_state
  - multihop_route_execution_out_of_scope
