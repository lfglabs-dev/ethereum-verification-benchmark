abstraction_notes: >
  Models the source function boundary, valuation-handler authorization, optional
  tracker branches, management-before-performance ordering, checked arithmetic,
  and aggregate plus per-recipient owed-value updates. Each external boundary
  queries the universally quantified Verity.Env call oracle with the separate
  dynamic target, exact ABI selector, and exact calldata words. A second oracle
  response controls success, and returndata remains arbitrary. Successful calls
  apply Env.reenter; accounting theorems assume that hook is the identity.
  Pinned Verity supports ABI-faithful runtime-target static-word calls; this case
  deliberately uses Env.callOracle because executable EDSL call semantics do not
  provide arbitrary parametric return outcomes for this theorem. Applying
  Env.reenter to the valuation-handler view call is conservative relative to
  Solidity STATICCALL.
  Valuation-handler returndata is projected to its low 160 address bits, so the
  model conservatively admits non-canonical words rejected by Solidity ABI decoding.
  A successful oracle branch supplies one full return word; returndata-length and
  ABI-decode failures are folded into the call-failure outcome.
  External callee formulas, callee state, and event logs are not executed.
  uint256 arithmetic, and theorem hypotheses cover every successful checked add.
  Event emission and unrelated configuration/claim functions are omitted.
unsupported_feature_codes:
  - stateful_external_callee_execution_omitted
  - event_emission_omitted
notes: >
  Proves with no custom axioms and no sorry/admit that a successful settlement
  with both dynamic trackers enabled uses the configured targets and exact
  management-then-performance calldata, increases total fees owed
  by exactly both arbitrary returned amounts, credits the configured recipients,
  handles recipient aliasing, and frames the modeled scalar, address, and mapping
  storage projections. Verity knownAddresses bookkeeping is outside that frame.
  Separate theorems cover successful management-only, performance-only, and
  both-disabled branches plus transactional rollback for every modeled raw revert.
  Official onyx-sdk metadata independently
  identifies LIVE Ethereum v1 implementation addresses; it does not establish
  bytecode equivalence to the pinned protocol source commit.
