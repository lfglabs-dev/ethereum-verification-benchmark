abstraction_notes: >
  Source-shaped executable multi-contract semantic model using Verity Address/UIntN and invariant
  APIs. All eight complete specification groups and PolicyBundle have machine-checked reference
  proofs. Root/child allocation and list writers are concrete; non-custody arithmetic and creation
  authorization use explicit projections. The ordinary batch theorem requires a successful initial
  capacity observation. Deposits credit measured custody receipts; withdrawals reserve the
  requested maximum, pin before callbacks, refund the difference and account for actual debit.
  Source/helper/storage/external correspondence is manually reviewed; no
  Solidity compiler or bytecode refinement is claimed. Original Solidity is not distributed.
