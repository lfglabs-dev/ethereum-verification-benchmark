abstraction_notes: >
  The slice models `previewDeposit`, the redeem-direction conversion
  `previewRedeem`, and the state-changing `deposit` using total-assets and
  total-shares storage together with fixed virtual offsets. Token transfers,
  fees, hooks, and share burning are omitted so the benchmark can focus on
  rounding-sensitive share/asset conversion and the virtual-liquidity defense
  surface, including deposit/redeem round-trip loss bounds and share-price
  behavior under direct asset donations.
