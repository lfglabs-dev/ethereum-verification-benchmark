notes: >
  Active ERC-4626 benchmark slice derived from OpenZeppelin's virtual-offset
  design and inflation-attack analysis. The committed proof module validates
  the four original arithmetic and state-transition theorems plus the two
  harder rounding tasks (deposit/redeem round-trip bound and share-price
  monotonicity under donation), so every task is runnable in the
  reference-solution benchmark path.
