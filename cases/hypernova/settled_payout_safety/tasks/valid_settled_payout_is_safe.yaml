abstraction_notes: >
  Proves exact account equity reduction, one-shot settlement closure, one nonce
  increment, and equal Vault debit plus trader credit for the split-adjusted USDC
  amount on the valid deployed payout path. The at-most-gross split bound is derived
  from the clamped basis-point formula rather than assumed. Signature authorization is an explicit
  trusted equality hypothesis whose body-less operations take the source EIP-712 tuple,
  consumed nonce, pinned domain separator, and parsed signature as arguments. Their
  cryptographic semantics are not mechanically proved.
