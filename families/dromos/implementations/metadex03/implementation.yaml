notes: Executable root-ledger projection for the Dromos Labs team. All eight target-writer entries are modeled, including CHAIN0/TOKEN0 and arbitrary finite authenticated deallocation callbacks. EnumerableSet retains logical values and independently stored index-plus-one positions, with moved-position updates, removed-position resets and clear positions loop. Initialization, concrete arbitrary-list add/remove/swap-and-pop representation preservation, exact one-cell amount/token/position frames, support/range and finite-sum replacement are mechanically proved. Operational writer/callback preservation and Reachable transaction conservation depend only on standard Lean foundations, not a case-local domain axiom. Full source-to-model/physical-storage/bytecode refinement is unproved. Non-ledger signed point/cast/transport failures are conservatively omitted. View results and chain/gauge guards are explicit symbolic inputs. The selected claim is allocation amount sum equals committed; support pairing and set representation are auxiliary. Independent Proof and Red Team re-reviews passed for the symbolic ledger-model proof; source/physical-storage/bytecode correspondence remains unproved. No private/deployed or whole-source verified-result claim.
